# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
        
          # Upload entire repository
          path: '.'
 name: Angular Setup
  # You may pin to the exact commit or the version.
  # uses: mayurrawte/github-angular-actions@e4678e9a4e3720745a90de753757b05ae9f43595
  uses: mayurrawte/github-angular-actions@v2.0.0
  with:
    # Angular CLI version to install (e.g. 17.3.8, 18.0.0, or latest)
    version: # optional, default is latest
    # Node.js version to use (e.g. 22, 20, 18)
    node-version: # optional, default is 22
    # Package manager to cache and use for the global CLI install: npm, yarn, or pnpm
    package-manager: # optional, default is npm
    # Path to the lock file for caching (e.g. packages/app/package-lock.json). Defaults to repo root.
    cache-dependency-path: # optional, default is 
    # Enable package manager caching. Set to false to disable (e.g. if no lock file exists).
    cache: # optional, default is true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
